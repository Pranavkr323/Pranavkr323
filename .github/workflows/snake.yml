name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate the snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Pranavkr323
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Deploy to output branch
      - name: Deploy Snake
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist